[project]
name = "keystone"
version = "0.0.1"
description = "Intent -> grounded consensus design -> deterministic simulation -> validated architecture."
requires-python = ">=3.10"
# Phase-0 engine is pure stdlib — zero runtime dependencies on purpose.
dependencies = []

[project.optional-dependencies]
# Added as the backend/council come online. Kept out of the engine.
council = ["anthropic>=0.40"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "pyjwt[crypto]>=2.8", "python-multipart>=0.0.9"]
db = ["supabase>=2.31", "python-dotenv>=1.0"]
# Raw Postgres driver for the ADR-005 §1b tenant-isolation test harness ONLY
# (scripts/test_tenant_isolation.sh, prototype/tests/db_test_*.py) — kept separate from `db`
# on purpose: `db` is what real application code (the future SupabaseModelStore) depends on
# at runtime, talking through PostgREST with a user JWT so RLS is always in force. psycopg
# connects as superuser and deliberately bypasses that path (creates roles, applies raw DDL,
# SET LOCAL ROLE at will) — separating it keeps "test/ops tooling, never application code" a
# property of the dependency graph, not just a comment.
dbtest = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]


[tool.pytest.ini_options]
testpaths = ["prototype/tests"]

[tool.setuptools.packages.find]
# Setuptools normally auto-scans the repo ROOT for packages. That broke once
# frontend/ (a Next.js app, not Python) landed alongside prototype/ — setuptools
# saw two top-level dirs and refused to guess which one to install.
# This says: only look for packages inside prototype/ (finds keystone + api,
# skips tests/ and outputs/ since they have no __init__.py).
where = ["prototype"]


[tool.ruff]
line-length = 100
target-version = "py310"
# Pre-existing lint debt in Bifola's trust-critical core, out of scope for #23.
# Listed in the PR description for him to clean up separately.
extend-exclude = [
    "prototype/keystone/claude_council.py",
    "prototype/keystone/ingestion.py",
    "prototype/keystone/report.py",
    "prototype/keystone/simulation.py",
    "prototype/keystone/benchmarks/eval_harness.py",
    "prototype/run_scoring.py",
    "prototype/run_ticket_booking.py",
    "prototype/tests/test_grounding_seam.py",
]

[tool.mypy]
python_version = "3.10"
files = ["prototype/api"]
# api/ imports from keystone/ (real pre-existing type debt, Bifola's core, out of
# scope for #23). follow_imports="silent" still type-checks api/ against keystone's
# REAL signatures (so a wrong-type call into the engine is still caught) but stops
# mypy reporting errors that live inside keystone/ itself.
follow_imports = "silent"

[[tool.mypy.overrides]]
# supabase ships no type stubs, and it's a "db" extra, not part of "dev" — a plain
# `pip install -e ".[dev]"` won't have it installed. Without this, mypy fails on
# api/jobs.py's `from supabase import create_client`.
module = ["supabase", "supabase.*"]
ignore_missing_imports = true



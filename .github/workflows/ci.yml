name: CI

# DORMANT — GitHub Actions is unavailable on this account (billing / spending limit),
# so auto-runs only post a misleading red ✗ on PRs. CI now runs LOCALLY via
# `scripts/check.sh`, and the merge gate is MANUAL: the reviewer runs the suite + an
# adversarial review, then squash-merges (see CONTRIBUTING.md "Reviewer runbook").
# Switched to manual dispatch so it can be re-enabled instantly if Actions returns —
# restore the `pull_request:` + `push: branches: [main]` triggers below.
on:
  workflow_dispatch:

jobs:
  test:
    name: tests (engine + council)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The engine + council tests are zero-dependency (injected fake client, no API
      # key, $0) — but the api/worker tests import fastapi/supabase, so those extras
      # still need installing.
      - name: Install api + db extras
        run: pip install -e ".[api,db]"
      - name: Run test suite
        working-directory: prototype
        run: python -m unittest discover -s tests -v

  lint:
    name: lint + type (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Installs the project + its dev extras (ruff, mypy) AND the api/db extras
      # (fastapi, pydantic, uvicorn, supabase) — mypy needs the real libs on disk to
      # type-check api/ against their actual signatures, same as
      # `pip install -e ".[dev,api,db]"` locally.
      - name: Install dev + api + db tools
        run: pip install -e ".[dev,api,db]"
      - name: ruff check
        run: ruff check .
      - name: mypy (prototype/api)
        run: mypy
